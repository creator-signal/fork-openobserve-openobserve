name: Creator Signal OIDC CI

on:
  pull_request:
  push:
    branches:
      - main
      - creator-signal/oidc-main

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: nightly-2026-05-20

jobs:
  rust:
    name: Rust OSS and OIDC
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          prefix-key: creator-signal-oidc
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libssl-dev pkg-config
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check unchanged OSS build
        run: cargo check --locked
      - name: Check OIDC build
        run: cargo check --locked --features oidc
      - name: Test OIDC and scoped automation enforcement
        env:
          CARGO_BUILD_JOBS: 2
          CARGO_PROFILE_TEST_DEBUG: 0
          CARGO_TERM_COLOR: never
        run: |
          set -euo pipefail
          run_tests() {
            label="$1"
            shift
            log="$RUNNER_TEMP/${label}.log"
            cargo test "$@" | tee "$log"
            grep -Eq 'test result: ok\. [1-9][0-9]* passed' "$log"
          }
          run_tests oidc --locked -p openobserve-api-common --features oidc auth::oidc::tests
          run_tests automation --locked -p openobserve-api-common --features oidc auth::automation::tests
          run_tests middleware --locked -p openobserve-api-http --features oidc handler::http::router::middlewares::scoped_automation::tests

  web:
    name: Web login contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Type-check and build
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: npm run build
      - name: Test login and session services
        run: >-
          npm run test:unit -- --run
          components/login/Login.spec.ts
          services/auth.spec.ts
          services/http.spec.ts
          views/Login.spec.ts

  container:
    name: Container definition
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - name: Validate OIDC image definition
        run: docker buildx build --check --file deploy/build/Dockerfile.oidc .
